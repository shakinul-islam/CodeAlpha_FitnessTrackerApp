name: fitness_tracker

description: "A modern local-first Flutter fitness tracker."

publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.4.9

  # Local Database
  sqflite: ^2.4.4
  path: ^1.9.1

  # UI / Charts / Fonts
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.19.0

  # Device Features
  pedometer: ^4.2.0
  permission_handler: ^11.3.1

  # Local Settings
  shared_preferences: ^2.5.5

  # Notifications
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true